[project]
name = "trustbridge"
version = "0.1.0"
description = "Programmable trust layer for international freelancers: AI milestones, PayPal sandbox escrow, and FX risk management"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sourabh Kumar", email = "sourabh@trustbridge.network" }
]
license = { text = "PolyForm Noncommercial License 1.0.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
